name: 🎰 Mise à jour des résultats FDJ

# Écrit directement dans MongoDB : plus de fichier JSON ni d'upload FTP.
# Utile si le worker ne tourne pas en continu sur le serveur (hébergement sans process permanent).
# Secret requis : MONGODB_URI (Settings > Secrets and variables > Actions).

on:
  schedule:
    - cron: '45 20 * * *'   # ~21h45 / 22h45 heure de Paris
    - cron: '30 21 * * *'   # ~22h30 / 23h30
    - cron: '30 7 * * *'    # rattrapage du matin (répartitions publiées tard)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: 🎯 Scraping + alertes
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python backend/manage.py scrape
