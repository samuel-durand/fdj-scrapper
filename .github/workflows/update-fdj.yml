name: 🎰 Mise à jour des résultats FDJ

# Écrit directement dans MongoDB (remplace le worker, payant sur Render).
# Secret requis : MONGODB_URI (Settings > Secrets and variables > Actions).
#
# Toutes les 15 min : Amigo (un tirage toutes les 5 min) et Crescendo (tirages horaires du samedi)
# restent à jour ; pour les autres jeux, un passage sans nouveau tirage ne fait que 6 requêtes.
# GitHub peut retarder les tâches planifiées de quelques minutes aux heures chargées.

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '30 7 * * *'    # rattrapage du matin : répartitions des gains publiées tard
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Re-télécharger tous les tirages disponibles'
        type: boolean
        default: false

# Pas deux passages en même temps (le suivant attend la fin du précédent)
concurrency:
  group: scrape-fdj
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: 🎯 Scraping + alertes
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python backend/manage.py scrape ${{ inputs.refresh && '--refresh' || '' }}
