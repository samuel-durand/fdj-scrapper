# Déploiement Render (offre gratuite) : un seul service web.
# Flask sert l'API et le front compilé (dist/).
#
# La mise à jour des tirages tourne dans le service web lui-même (backend/app/autoupdate.py) :
# ni worker (payant sur Render) ni GitHub Action. Au premier démarrage, la base se remplit seule.
#
# Offre gratuite : le service s'endort après ~15 min sans visite et ne met alors plus rien à jour ;
# la visite suivante le réveille (premier chargement ~30-60 s) et il rattrape aussitôt les tirages
# publiés entre-temps.
services:
  - type: web
    name: loterie-resultats
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r backend/requirements.txt && npm ci --include=dev && npm run build
    startCommand: gunicorn --chdir backend wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
